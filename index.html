<meta name="theme-color" content="#101828">
<!-- Mã Travelpayouts Drive (theo yêu cầu khi đăng ký tài khoản) -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Lexend:wght@500;600;700&display=swap">
<style>
/* Bố cục: khối đầu trang toàn màn hình với hình bầu trời và máy bay, ô tìm vé nổi – thẻ ảnh "Giảm sâu nhất" – lịch giá – danh sách vé – lưới ảnh điểm đến – 3 lý do chọn – giải thích giá – chân trang xanh đậm */
:root{
  --bg:#EDF2FA; --surface:#FFFFFF; --surface-2:#F3F7FD; --ink:#0A1A3A; --muted:#455371; --faint:#6F7C97; --line:#D8E2F0;
  --brand:#0B5BD3; --brand-ink:#0846A8; --brand-deep:#061F4D; --brand-soft:#E2ECFF; --brand-glow:#3D8BFF;
  --cta:#FF6A1A; --cta-hover:#F05A0A;
  --price:#C2410C;
  --good:#05774A; --good-soft:#DCF4E7; --mid:#8C5D00; --mid-soft:#FFF2D2; --high:#C2410C; --high-soft:#FFE6D9;
  --biz:#5B3FB0; --biz-soft:#ECE6FC;
  --hero-ink:#FFFFFF; --hero-muted:#D6E4FF;
  --field:#FFFFFF; --field-ink:#0A1A3A;
  --sh-sm:0 1px 2px rgba(10,26,58,.06),0 2px 8px rgba(10,26,58,.06);
  --sh-lg:0 18px 50px rgba(6,31,77,.28),0 4px 12px rgba(6,31,77,.12);
  --display:"Lexend","Be Vietnam Pro",-apple-system,"Segoe UI","PingFang SC","Hiragino Sans","Apple SD Gothic Neo","Microsoft YaHei","Yu Gothic","Malgun Gothic",Arial,sans-serif;
  --font:"Be Vietnam Pro",-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans","Apple SD Gothic Neo","Microsoft YaHei","Yu Gothic","Malgun Gothic",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#08111F; --surface:#111C2E; --surface-2:#16233A; --ink:#EAF0FA; --muted:#A9B6CC; --faint:#7F8CA3; --line:#24324A;
  --brand:#4C8DFF; --brand-ink:#8DB6FF; --brand-deep:#040B18; --brand-soft:#16264A; --brand-glow:#4C8DFF;
  --price:#FF9A62;
  --good:#5FD6A0; --good-soft:#0F2E23; --mid:#F2C35B; --mid-soft:#33290F; --high:#FF9A62; --high-soft:#3A1F12;
  --biz:#B8A4FF; --biz-soft:#241E40;
  --field:#16233A; --field-ink:#EAF0FA;
  --sh-sm:none; --sh-lg:0 18px 50px rgba(0,0,0,.5); color-scheme:dark}}
*{box-sizing:border-box}
html{background:var(--brand-deep)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--display)}
p{margin:0}
a{color:var(--brand-ink)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--brand-glow);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ===== Khối đầu trang ===== */
.hero{position:relative;color:var(--hero-ink);overflow:hidden;background:#04163F;isolation:isolate}
.hero-art{position:absolute;inset:0;z-index:-2}
.hero-art svg{width:100%;height:100%;display:block}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(3,14,40,.82) 0%,rgba(3,14,40,.55) 42%,rgba(3,14,40,0) 75%),linear-gradient(0deg,rgba(3,14,40,.55) 0%,rgba(3,14,40,0) 40%)}
.topbar{padding-top:env(safe-area-inset-top,0px)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:14px;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.02em;text-decoration:none;color:#FFFFFF}
.mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#3D8BFF,#0B5BD3);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(61,139,255,.45)}
.brand b{color:#7DB3FF;font-weight:700}
.prefs{display:flex;gap:8px;align-items:center}
.pref{position:relative}
.pref select{appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.12);color:#FFFFFF;border:1px solid rgba(255,255,255,.28);border-radius:10px;min-height:40px;padding:0 30px 0 12px;font-size:14px;font-weight:600;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pref select option,.pref select optgroup{color:#0A1A3A;background:#FFFFFF}
.pref::after{content:"";position:absolute;right:12px;top:50%;width:7px;height:7px;border-right:2px solid #D6E4FF;border-bottom:2px solid #D6E4FF;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.hero-body{padding-top:clamp(24px,6vw,64px);padding-bottom:28px;display:flex;flex-direction:column;gap:16px}
.kicker{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(61,139,255,.22);border:1px solid rgba(125,179,255,.45);color:#E4EEFF;font-size:13px;font-weight:600;letter-spacing:.02em}
.hero h1{font-size:clamp(32px,6.2vw,62px);line-height:1.04;font-weight:700;letter-spacing:-.035em;max-width:760px;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.hero h1 em{font-style:normal;color:#8EC0FF}
.hero .sub{color:var(--hero-muted);max-width:600px;font-size:clamp(15px,1.6vw,17px)}
.hstats{display:flex;flex-wrap:wrap;gap:8px 18px;color:#E4EEFF;font-size:14px}
.hstats span{display:inline-flex;align-items:center;gap:8px}
.hstats b{font-family:var(--display);font-size:18px;color:#FFFFFF}
.dot{width:8px;height:8px;border-radius:50%;background:#3DD68C;flex:0 0 8px;box-shadow:0 0 0 4px rgba(61,214,140,.2)}
.dot.old{background:#F2C35B;box-shadow:0 0 0 4px rgba(242,195,91,.2)}

.card-search{margin-top:10px;background:var(--surface);color:var(--ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh-lg);border:1px solid rgba(255,255,255,.6)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;align-self:flex-start}
.seg button{border:0;background:transparent;border-radius:9px;min-height:38px;padding:0 16px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#FFFFFF;box-shadow:0 4px 12px rgba(11,91,211,.35)}
.fields{display:grid;grid-template-columns:minmax(0,1fr) 46px minmax(0,1fr) minmax(0,.8fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label,.f .lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.f select,.f input,.paxbtn{min-height:54px;width:100%;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--field);color:var(--field-ink);font-size:15px;font-weight:600;min-width:0}
.f select:hover,.f input:hover,.paxbtn:hover{border-color:#9DBBEA}
.swap{height:54px;border-radius:50%;width:46px;border:1.5px solid var(--line);background:var(--brand-soft);color:var(--brand-ink);display:flex;align-items:center;justify-content:center}
.paxbtn{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{min-height:54px;border:0;border-radius:12px;background:var(--cta);color:#FFFFFF;font-weight:700;font-size:16px;padding:0 24px;white-space:nowrap;box-shadow:0 8px 20px rgba(255,106,26,.4);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.go:hover{background:var(--cta-hover)}
.paxwrap{position:relative}
.paxpanel{position:absolute;z-index:20;top:calc(100% + 6px);right:0;width:min(330px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-lg);padding:14px;display:flex;flex-direction:column;gap:12px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.prow b{display:block;font-size:15px}
.prow small{color:var(--muted);font-size:12px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface-2);font-size:18px;font-weight:700;line-height:1;color:var(--brand-ink)}
.step button:disabled{opacity:.35;cursor:not-allowed}
.step span{min-width:18px;text-align:center;font-weight:700}
.paxpanel .seg{align-self:stretch;display:flex}
.paxpanel .seg button{flex:1}
.done{min-height:44px;border:0;border-radius:10px;background:var(--brand);color:#FFFFFF;font-weight:700}
@media (max-width:900px){
  .fields{grid-template-columns:minmax(0,1fr) 46px minmax(0,1fr)}
  .f.date{grid-column:1/2}.paxwrap{grid-column:2/4}
  .go{grid-column:1/-1}
}
@media (max-width:560px){
  .fields{grid-template-columns:minmax(0,1fr) 46px}
  .ffrom{grid-column:1;grid-row:1}.fto{grid-column:1;grid-row:2}
  .swap{grid-column:2;grid-row:1/3;height:46px;align-self:center;margin-top:22px}
  .f.date,.paxwrap,.go{grid-column:1/-1}
}

/* ===== Phần chính ===== */
main .wrap{padding-top:34px;padding-bottom:56px;display:flex;flex-direction:column;gap:40px}
.sec{display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
.sec h2{font-size:clamp(22px,2.6vw,30px);font-weight:700;letter-spacing:-.025em;color:var(--ink)}
.hint{font-size:13px;color:var(--muted)}
.notice{background:var(--mid-soft);color:var(--mid);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:500}

/* Thẻ có ảnh */
.pimg{position:relative;aspect-ratio:5/3;max-width:100%;overflow:hidden;background:var(--brand-deep)}
.pimg svg,.pimg img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.deals{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory}
.deal{flex:0 0 240px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:0;overflow:hidden;display:flex;flex-direction:column;text-align:left;box-shadow:var(--sh-sm);transition:transform .15s ease,box-shadow .15s ease}
.deal:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}
.deal .pimg .badge{position:absolute;top:10px;left:10px}
.deal .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px}
.deal .to{font-family:var(--display);font-weight:700;font-size:17px}
.deal .when{font-size:13px;color:var(--muted)}
.deal strong{font-size:19px;color:var(--price);margin-top:4px}
.deal .from{font-size:12px;color:var(--faint)}

.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.b-off{background:var(--good-soft);color:var(--good)}
.pimg .b-off{background:#05774A;color:#FFFFFF;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.b-best{background:var(--high-soft);color:var(--high)}
.b-biz{background:var(--biz-soft);color:var(--biz)}
.b-eco{background:var(--brand-soft);color:var(--brand-ink)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--sh-sm);display:flex;flex-direction:column;gap:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;min-width:0}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.stat b{font-family:var(--display);font-size:20px;font-weight:700}
.stat b.good{color:var(--good)}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:14px}}

.cal{position:relative;display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.day{flex:0 0 78px;scroll-snap-align:center;min-height:80px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:7px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;position:relative;overflow:hidden}
.day .d1{font-size:11px;color:var(--muted);font-weight:600}
.day .d2{font-size:14px;font-weight:700}
.day .d3{font-size:13px;font-weight:700}
.day.lv1 .d3{color:var(--good)}.day.lv2 .d3{color:var(--mid)}.day.lv3 .d3{color:var(--high)}
.day::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px}
.day.lv1::after{background:var(--good)}.day.lv2::after{background:#E0A82E}.day.lv3::after{background:#E8703A}
.day.sel{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 2px var(--brand) inset}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brand);color:#FFFFFF;border-color:var(--brand)}
.vsep{width:1px;height:22px;background:var(--line)}

.list{display:flex;flex-direction:column;gap:12px}
.fare{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr) auto;gap:14px 22px;align-items:center;box-shadow:var(--sh-sm);position:relative;overflow:hidden}
.fare::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent}
.fare.sel{border-color:var(--brand)}.fare.sel::before{background:var(--brand)}
.air{display:flex;gap:12px;align-items:center;min-width:0}
.logo{width:44px;height:44px;border-radius:12px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 44px;font-size:12px;font-weight:800;color:var(--brand-ink);position:relative}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#FFFFFF}
.air .nm{display:flex;flex-direction:column;gap:2px;min-width:0}
.air .nm b{font-size:14px;line-height:1.3}
.air .nm small{font-size:12px;color:var(--muted)}
.legs{display:flex;flex-direction:column;gap:8px;min-width:0}
.leg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;align-items:baseline}
.leg .lt{font-size:11px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.08em;grid-column:1/-1}
.leg .dt{font-family:var(--display);font-weight:600;font-size:16px;white-space:nowrap}
.leg .info{font-size:13px;color:var(--muted);min-width:0}
.leg .info .dir{color:var(--good);font-weight:600}
.leg .info .stp{color:var(--mid);font-weight:600}
.price{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}
.price .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.price strong{font-family:var(--display);font-size:24px;font-weight:700;color:var(--price);white-space:nowrap;letter-spacing:-.01em}
.price .per{font-size:12px;color:var(--muted)}
.price .avg{font-size:12px;color:var(--faint)}
.price .tot{font-size:13px;font-weight:600}
.price .kid{font-size:12px;color:var(--muted);max-width:220px}
.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 20px;border-radius:11px;background:var(--brand);color:#FFFFFF;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap;margin-top:4px;box-shadow:0 6px 14px rgba(11,91,211,.3)}
.btn:hover{background:var(--brand-ink)}
@media (max-width:760px){
  .fare{grid-template-columns:minmax(0,1fr)}
  .price{align-items:stretch;text-align:left;border-top:1px dashed var(--line);padding-top:10px}
  .price .tags{justify-content:flex-start}
}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.more{align-self:center;min-height:44px;padding:0 22px;border-radius:11px;border:1.5px solid var(--brand);background:var(--surface);color:var(--brand-ink);font-weight:700}

/* Lưới ảnh điểm đến */
.dest{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.dc{position:relative;border:0;padding:0;border-radius:18px;overflow:hidden;text-align:left;color:#FFFFFF;background:var(--brand-deep);aspect-ratio:4/3;max-width:100%;box-shadow:var(--sh-sm);transition:transform .15s ease,box-shadow .15s ease}
.dc:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}
.dc:first-child{grid-column:span 2;grid-row:span 2;aspect-ratio:auto}
.dc svg,.dc img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.dc .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,14,40,0) 35%,rgba(3,14,40,.85) 100%)}
.dc .tx{position:absolute;left:14px;right:14px;bottom:14px;display:flex;flex-direction:column;gap:2px}
.dc b{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.15;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.dc:first-child b{font-size:30px}
.dc span{font-size:12px;color:#D6E4FF}
.dc strong{font-family:var(--display);font-size:18px;font-weight:700;color:#FFFFFF}
.dc .tag{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#FFFFFF;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;letter-spacing:.04em}
@media (max-width:900px){.dest{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.dest{gap:10px}.dc b{font-size:17px}.dc:first-child b{font-size:24px}}

/* Lý do chọn */
.feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.feat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh-sm)}
.feat .ic{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#3D8BFF,#0B5BD3);display:flex;align-items:center;justify-content:center;color:#FFFFFF;box-shadow:0 8px 18px rgba(11,91,211,.3)}
.feat h3{font-size:17px;font-weight:700}
.feat p{font-size:14px;color:var(--muted)}
@media (max-width:760px){.feats{grid-template-columns:minmax(0,1fr)}}

.how{background:var(--brand-soft);border-radius:18px;padding:20px 22px}
.how h2{font-size:18px}
.how ul{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:14px;max-width:85ch}
footer{background:var(--brand-deep);color:#B9C8E4}
footer .wrap{padding-top:30px;padding-bottom:30px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:10px}
footer .brand{font-size:19px}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
:lang(ko),:lang(ja),:lang(zh){word-break:keep-all;line-break:strict}
</style>
</head>
<body>

<section class="hero">

    <section class="sec" aria-labelledby="cal-h">

      <div class="list" id="list"></div>
      <button type="button" class="more" id="more" hidden data-t="more"></button>
    </section>

    <section class="sec" aria-labelledby="dest-h">
      <div class="sec-h"><div><p class="eyebrow" data-t="eyeDest"></p><h2 id="dest-h"></h2><p class="hint" data-t="destSub"></p></div></div>
      <div class="dest" id="dest"></div>

        <div class="feat"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></span><h3 data-t="f1t"></h3><p data-t="f1"></p></div>

    </section>

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(s,o){return String(s).replace(/\{(\w+)\}/g,function(m,k){return o&&o[k]!=null?o[k]:'';});}
function t(k,o){var d=T[st.lang]||T.vi;return fmt(d[k]!=null?d[k]:T.vi[k],o);}
function city(c){var x=CITY[c];return x?x[LIDX[st.lang]]:c;}
function isVN(c){var x=CITY[c];return x?x[5]===1:false;}
function pad(n){return (n<10?'0':'')+n;}
function dOf(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function isoLocal(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtDate(s,opt){try{return new Intl.DateTimeFormat(LOCALE[st.lang],opt).format(dOf(s));}catch(e){return s;}}
function dShort(s){return fmtDate(s,{weekday:'short',day:'numeric',month:'numeric'});}
function dLong(s){return fmtDate(s,{weekday:'long',day:'numeric',month:'long'});}
function dur(m){if(!m)return '';var h=Math.floor(m/60),mi=m%60;return st.lang==='vi'?(h?h+' giờ ':'')+(mi?mi+' phút':''):st.lang==='zh'?(h?h+'小时':'')+(mi?mi+'分钟':''):st.lang==='ja'?(h?h+'時間':'')+(mi?mi+'分':''):st.lang==='ko'?(h?h+'시간 ':'')+(mi?mi+'분':''):(h?h+'h ':'')+(mi?mi+'m':'');}
function nights(a,b){return Math.round((dOf(b)-dOf(a))/86400000);}
function money(vnd){
  var c=st.cur,v=vnd,approx=false;
  if(c!=='VND'){var r=DATA&&DATA.ty_gia&&DATA.ty_gia[c];if(r){v=vnd*r;approx=true;}else{c='VND';}}
  var s;try{s=new Intl.NumberFormat(LOCALE[st.lang],{style:'currency',currency:c,maximumFractionDigits:(c==='USD'||c==='EUR')&&v<10?1:0}).format(v);}catch(e){s=Math.round(v)+' '+c;}
  return (approx?'≈ ':'')+s;
}
function median(arr){if(!arr.length)return 0;var s=arr.slice().sort(function(a,b){return a-b;});var m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;}

function fillSelects(){
  var os=origins();if(!os.length)return;
  if(!st.from||os.indexOf(st.from)<0)st.from=os.indexOf('HAN')>=0?'HAN':os[0];
  $('from').innerHTML=optList(os);$('from').value=st.from;
  var ds=routesFrom(st.from);
  if(!st.to||ds.indexOf(st.to)<0)st.to=ds.indexOf('SGN')>=0?'SGN':ds[0];
  $('to').innerHTML=optList(ds);$('to').value=st.to;
}
function paxText(){
  var cab=st.cabin==='biz'?t('business'):t('economy');
  return t('paxSum',{a:st.a,as:st.a>1?'s':'',c:st.c?t('paxC',{n:st.c,cs:st.c>1?'ren':''}):'',i:st.i?t('paxI',{n:st.i,is:st.i>1?'s':''}):'',cab:cab});
}
function syncPax(){
  $('pa').textContent=st.a;$('pc').textContent=st.c;$('pi').textContent=st.i;$('paxbtn').textContent=paxText();
  var tot=st.a+st.c;
  document.querySelector('[data-p="a"][data-d="-1"]').disabled=st.a<=1||st.i>=st.a;
  document.querySelector('[data-p="a"][data-d="1"]').disabled=tot>=9;
  document.querySelector('[data-p="c"][data-d="-1"]').disabled=st.c<=0;
  document.querySelector('[data-p="c"][data-d="1"]').disabled=tot>=9;
  document.querySelector('[data-p="i"][data-d="-1"]').disabled=st.i<=0;
  document.querySelector('[data-p="i"][data-d="1"]').disabled=st.i>=st.a;
  Array.prototype.forEach.call(document.querySelectorAll('[data-cabin]'),function(b){b.setAttribute('aria-pressed',b.getAttribute('data-cabin')===st.cabin?'true':'false');});
  Array.prototype.forEach.call(document.querySelectorAll('[data-trip]'),function(b){b.setAttribute('aria-pressed',b.getAttribute('data-trip')===st.trip?'true':'false');});
}

function renderDeals(){
  $('deals-h').textContent=t('deals',{city:city(st.from)});
  var box=$('deals'),out=[];
  routesFrom(st.from).forEach(function(d){
    var l=withOff(faresOf(st.from,d));if(l.length<4)return;
    var best=null;l.forEach(function(v){if(!best||v.off>best.off||(v.off===best.off&&v.gia<best.gia))best=v;});
    if(best&&best.off>=10)out.push({to:d,v:best});
  });
  out.sort(function(a,b){return b.v.off-a.v.off;});
  if(!out.length){box.innerHTML='<p class="hint">'+esc(t('noDeals'))+'</p>';return;}
  box.innerHTML=out.slice(0,10).map(function(x,i){
    return '<button type="button" class="deal" data-i="'+i+'"><span class="pimg">'+cityImg(x.to)+'<span class="badge b-off" title="'+esc(t('offTitle',{n:x.v.off}))+'">'+esc(t('off',{n:x.v.off}))+'</span></span>'+
      '<span class="body"><span class="to">'+esc(city(x.to))+'</span><span class="when">'+esc(dShort(x.v.ngay))+(x.v.ngay_ve?' → '+esc(dShort(x.v.ngay_ve)):'')+'</span>'+
      '<strong class="num">'+esc(money(x.v.gia))+'</strong><span class="from">'+esc(t('fromCity',{city:city(st.from)}))+' · '+esc(st.trip==='rt'?t('roundTrip'):t('oneWay'))+'</span></span></button>';
  }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('.deal'),function(b){b.addEventListener('click',function(){var x=out[+b.getAttribute('data-i')];st.to=x.to;st.sel=x.v.ngay;st.show=20;fillSelects();renderRoute(true);});});
}

function renderRoute(scroll){
  var l=withOff(faresOf(st.from,st.to));
  $('cal-h').textContent=t('calTitle',{a:city(st.from),b:city(st.to)});
  if(st.sel&&!l.some(function(v){return v.ngay===st.sel;}))st.sel=null;
  if(!st.sel&&l.length){var re=l[0];l.forEach(function(v){if(v.gia<re.gia)re=v;});st.sel=re.ngay;}
  if(st.sel)$('date').value=st.sel;
  // Ô số liệu
  var sb=$('stats');
  if(l.length){
    var re2=l[0],bo=l[0];l.forEach(function(v){if(v.gia<re2.gia)re2=v;if(v.off>bo.off)bo=v;});
    var cells=[[t('lowest'),money(re2.gia),'good'],[t('onDate'),dShort(re2.ngay),''],[t('average'),money(re2.md),''],[t('bestOff'),bo.off>0?t('off',{n:bo.off}):'—','good']];
    sb.innerHTML=cells.map(function(c){return '<div class="stat"><span>'+esc(c[0])+'</span><b class="num '+c[2]+'">'+esc(c[1])+'</b></div>';}).join('');
  }else sb.innerHTML='';
  // Lịch giá: chia 3 mức theo giá
  var cal=$('cal');
  var ps=l.map(function(v){return v.gia;}).sort(function(a,b){return a-b;});
  var q1=ps[Math.floor(ps.length/3)]||0,q2=ps[Math.floor(ps.length*2/3)]||0;
  cal.innerHTML=l.map(function(v){
    var lv=v.gia<=q1?1:(v.gia<=q2?2:3);var k=Math.round(v.gia/1000);
    var short=st.cur==='VND'?(k>=1000?(Math.round(k/100)/10)+'tr':k+'k'):money(v.gia).replace('≈ ','');
    if(st.cur==='VND'&&st.lang!=='vi')short=(k>=1000?(Math.round(k/100)/10)+'M':k+'K');
    return '<button type="button" class="day lv'+lv+(v.ngay===st.sel?' sel':'')+'" data-d="'+v.ngay+'" aria-pressed="'+(v.ngay===st.sel)+'" aria-label="'+esc(dLong(v.ngay)+', '+money(v.gia))+'">'+
      '<span class="d1">'+esc(fmtDate(v.ngay,{weekday:'short'}))+'</span><span class="d2 num">'+esc(fmtDate(v.ngay,{day:'numeric',month:'numeric'}))+'</span><span class="d3 num">'+esc(short)+'</span></button>';
  }).join('');
  Array.prototype.forEach.call(cal.querySelectorAll('.day'),function(b){b.addEventListener('click',function(){st.sel=b.getAttribute('data-d');var idx=sorted().map(function(v){return v.ngay;}).indexOf(st.sel);if(idx>=st.show)st.show=idx+5;renderRoute(true);});});
  renderAirChips(l);
  renderList();
  renderDest();
  setTimeout(function(){
    var s=cal.querySelector('.sel');if(s){cal.scrollLeft=s.offsetLeft-cal.offsetLeft-(cal.clientWidth-s.clientWidth)/2;}
    if(scroll){var f=$('f-'+st.sel);if(f){try{f.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){}}}
  },0);
}

function renderAirChips(l){
  var box=$('airChips');var set={};l.forEach(function(v){if(v.hang)set[v.hang]=(set[v.hang]||0)+1;});
  var keys=Object.keys(set).sort(function(a,b){return set[b]-set[a];});
  if(st.air&&!set[st.air])st.air=null;
  if(keys.length<2){box.innerHTML='';return;}
  box.innerHTML='<button type="button" class="chip" data-air="" aria-pressed="'+(!st.air)+'">'+esc(t('allAir'))+'</button>'+keys.map(function(k){return '<button type="button" class="chip" data-air="'+esc(k)+'" aria-pressed="'+(st.air===k)+'">'+esc(AIRLINE[k]||k)+'</button>';}).join('');
  Array.prototype.forEach.call(box.querySelectorAll('[data-air]'),function(b){b.addEventListener('click',function(){st.air=b.getAttribute('data-air')||null;renderAirChips(withOff(faresOf(st.from,st.to)));renderList();});});
}

function sorted(){
  var l=withOff(faresOf(st.from,st.to));
  if(st.direct)l=l.filter(function(v){return !v.dung&&!v.dung_ve;});
  if(st.air)l=l.filter(function(v){return v.hang===st.air;});
  if(st.sort==='price')l.sort(function(a,b){return a.gia-b.gia;});
  else if(st.sort==='off')l.sort(function(a,b){return b.off-a.off;});
  return l;
}

function legHtml(label,date,time,stops,mins,showDur){
  var s=stops?'<span class="stp">'+esc(t('stops',{n:stops}))+'</span>':'<span class="dir">'+esc(t('direct'))+'</span>';
  var parts=[];if(time)parts.push(esc(t('dep',{t:time})));if(showDur&&mins)parts.push(esc(dur(mins)));parts.push(s);
  return '<div class="leg"><span class="lt">'+esc(label)+'</span><span class="dt">'+esc(dShort(date))+'</span><span class="info">'+parts.join(' · ')+'</span></div>';
}

function renderList(){
  var list=$('list'),all=withOff(faresOf(st.from,st.to)),l=sorted();
  $('resCount').textContent=all.length?t('count',{n:all.length}):'';
  if(!l.length){
    var msg=st.cabin==='biz'&&!all.length?t('noBiz'):(st.direct&&all.length?t('noDirect'):t('noFare'));
    list.innerHTML='<div class="empty"><p>'+esc(msg)+'</p><a class="btn" target="_blank" rel="noopener" href="'+esc(searchLink())+'">'+esc(t('searchDirect'))+'</a></div>';
    $('more').hidden=true;return;
  }
  var min=Infinity;all.forEach(function(v){if(v.gia<min)min=v.gia;});
  list.innerHTML=l.slice(0,st.show).map(function(v){
    var biz=st.cabin==='biz';
    var logo=v.hang?'<span class="logo"><img alt="" loading="lazy" src="https://pics.avs.io/80/80/'+encodeURIComponent(v.hang)+'.png" onerror="this.remove()">'+esc(v.hang)+'</span>':'<span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 16l20-8-6 12-4-5-5 3 1-5z"/></svg></span>';
    var name=v.hang?(AIRLINE[v.hang]||v.hang):t('bizAir');
    var sub=[];if(v.so_hieu)sub.push(v.so_hieu);
    var tags='';
    if(v.gia===min)tags+='<span class="badge b-best">'+esc(t('cheapest'))+'</span>';
    if(v.off>=5)tags+='<span class="badge b-off" title="'+esc(t('offTitle',{n:v.off}))+'">'+esc(t('off',{n:v.off}))+'</span>';
    var legs=legHtml(t('out'),v.ngay,v.gio,v.dung,v.phut,true);
    if(st.trip==='rt'&&v.ngay_ve){legs+=legHtml(t('ret'),v.ngay_ve,v.gio_ve,v.dung_ve,0,false);var n=nights(v.ngay,v.ngay_ve);if(n>0)legs+='<span class="hint">'+esc(t('stay',{n:n}))+'</span>';}
    var tot=st.a>1?'<span class="tot num">'+esc(t('total',{n:st.a,p:money(v.gia*st.a)}))+'</span>':'';
    var kid=(st.c||st.i)?'<span class="kid">'+esc(t('kidNote'))+'</span>':'';
    return '<article class="fare'+(v.ngay===st.sel?' sel':'')+'" id="f-'+v.ngay+'">'+
      '<div class="air">'+logo+'<span class="nm"><b>'+esc(name)+'</b><small>'+esc(sub.join(' · '))+'</small><span><span class="badge '+(biz?'b-biz':'b-eco')+'">'+esc(biz?t('business'):t('economy'))+'</span></span></span></div>'+
      '<div class="legs">'+legs+'</div>'+
      '<div class="price"><span class="tags">'+tags+'</span><strong class="num">'+esc(money(v.gia))+'</strong><span class="per">'+esc(st.trip==='rt'?t('perAdultRT'):t('perAdultOW'))+'</span>'+
      '<span class="avg num">'+esc(t('avg',{p:money(v.md)}))+'</span>'+tot+kid+
      '<a class="btn" target="_blank" rel="noopener" href="'+esc(bookLink(v))+'">'+esc(t('view'))+'</a></div></article>';
  }).join('');
  $('more').hidden=l.length<=st.show;
}

function renderDest(){
  $('dest-h').textContent=t('destTitle',{city:city(st.from)});
  var box=$('dest'),rows=[];
  routesFrom(st.from).forEach(function(d){var l=faresOf(st.from,d);if(!l.length)return;var re=l[0];l.forEach(function(v){if(v.gia<re.gia)re=v;});rows.push({d:d,v:re});});
  rows.sort(function(a,b){return a.v.gia-b.v.gia;});
  if(rows.length>5)rows=rows.slice(0,5+Math.floor((rows.length-5)/4)*4);
  box.innerHTML=rows.map(function(r,i){return '<button type="button" class="dc" data-i="'+i+'">'+cityImg(r.d)+'<span class="ov"></span><span class="tag">'+esc(ctry(r.d))+'</span>'+
    '<span class="tx"><b>'+esc(city(r.d))+'</b><span>'+esc(t('destFrom',{d:dShort(r.v.ngay)}))+'</span><strong class="num">'+esc(t('priceFrom'))+' '+esc(money(r.v.gia))+'</strong></span></button>';}).join('');
  Array.prototype.forEach.call(box.querySelectorAll('.dc'),function(b){b.addEventListener('click',function(){var r=rows[+b.getAttribute('data-i')];st.to=r.d;st.sel=r.v.ngay;st.show=20;fillSelects();renderRoute(false);window.scrollTo(0,$('cal-h').getBoundingClientRect().top+window.pageYOffset-16);});});
}
function renderHeroStats(){
  var box=$('hstats');if(!DATA||!DATA.chang){box.innerHTML='';return;}
  var keys=Object.keys(DATA.chang),dests={},n=0;
  keys.forEach(function(k){dests[k.split('-')[1]]=1;var r=routeData.apply(null,k.split('-'));if(r)Object.keys(r).forEach(function(x){n+=(r[x]||[]).length;});});
  var it=[t('statRoutes',{n:'<b>'+keys.length+'</b>'}),t('statDest',{n:'<b>'+Object.keys(dests).length+'</b>'}),t('statDays',{n:'<b>'+n.toLocaleString(LOCALE[st.lang])+'</b>'})];
  box.innerHTML=it.map(function(x){return '<span>'+x+'</span>';}).join('');
}

function renderStamp(){
  if(!DATA||!DATA.cap_nhat_luc){$('stamp').textContent=t('noData');return;}
  var d=new Date(DATA.cap_nhat_luc);
  var s;try{s=new Intl.DateTimeFormat(LOCALE[st.lang],{hour:'2-digit',minute:'2-digit',day:'numeric',month:'numeric'}).format(d);}catch(e){s=d.toLocaleString();}
  $('stamp').textContent=t('updated',{t:s});
  var old=(Date.now()-d.getTime())/3600000>8;$('dot').className='dot'+(old?' old':'');
  if(old)notice(t('stale'));
}
function notice(m){var n=$('notice');n.textContent=m;n.hidden=!m;}

function renderAll(){applyText();syncPax();renderStamp();renderHeroStats();if(!DATA||!DATA.chang||!Object.keys(DATA.chang).length)return;fillCur();fillSelects();renderDeals();renderRoute(false);}

/* ========== SỰ KIỆN ========== */
$('lang').addEventListener('change',function(){st.lang=this.value;store.set('sankm-lang',st.lang);if(!store.get('sankm-cur')){st.cur=CUR_DEFAULT[st.lang];}renderAll();});
$('cur').addEventListener('change',function(){st.cur=this.value;store.set('sankm-cur',st.cur);renderAll();});
Array.prototype.forEach.call(document.querySelectorAll('[data-trip]'),function(b){b.addEventListener('click',function(){st.trip=b.getAttribute('data-trip');st.sel=null;st.show=20;syncPax();renderDeals();renderRoute(false);});});
Array.prototype.forEach.call(document.querySelectorAll('[data-cabin]'),function(b){b.addEventListener('click',function(){st.cabin=b.getAttribute('data-cabin');st.sel=null;st.show=20;syncPax();renderDeals();renderRoute(false);});});
Array.prototype.forEach.call(document.querySelectorAll('[data-p]'),function(b){b.addEventListener('click',function(){var k=b.getAttribute('data-p'),d=+b.getAttribute('data-d');st[k]+=d;if(st.a<1)st.a=1;if(st.c<0)st.c=0;if(st.i<0)st.i=0;if(st.i>st.a)st.i=st.a;if(st.a+st.c>9){st[k]-=d;}syncPax();renderList();});});
function togglePax(open){var p=$('paxpanel');p.hidden=!open;$('paxbtn').setAttribute('aria-expanded',open?'true':'false');}
$('paxbtn').addEventListener('click',function(){togglePax($('paxpanel').hidden);});
$('paxdone').addEventListener('click',function(){togglePax(false);$('paxbtn').focus();});
document.addEventListener('click',function(e){if(!$('paxpanel').hidden&&!e.target.closest('.paxwrap'))togglePax(false);});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('paxpanel').hidden){togglePax(false);$('paxbtn').focus();}});
$('from').addEventListener('change',function(){st.from=this.value;st.sel=null;st.show=20;fillSelects();renderDeals();renderRoute(false);});
$('to').addEventListener('change',function(){st.to=this.value;st.sel=null;st.show=20;renderRoute(false);});
$('swap').addEventListener('click',function(){if(!routeData(st.to,st.from))return;var a=st.from;st.from=st.to;st.to=a;st.sel=null;fillSelects();renderDeals();renderRoute(false);});
$('date').addEventListener('change',function(){var v=this.value;if(!v)return;var l=faresOf(st.from,st.to);var pick=null;l.forEach(function(x){if(!pick&&x.ngay>=v)pick=x.ngay;});if(pick){st.sel=pick;var idx=sorted().map(function(x){return x.ngay;}).indexOf(pick);if(idx>=st.show)st.show=idx+5;renderRoute(true);}});
$('go').addEventListener('click',function(){togglePax(false);renderRoute(true);var h=$('cal-h');window.scrollTo(0,h.getBoundingClientRect().top+window.pageYOffset-16);});
Array.prototype.forEach.call(document.querySelectorAll('[data-sort]'),function(b){b.addEventListener('click',function(){st.sort=b.getAttribute('data-sort');Array.prototype.forEach.call(document.querySelectorAll('[data-sort]'),function(o){o.setAttribute('aria-pressed',o===b?'true':'false');});renderList();});});
$('direct').addEventListener('click',function(){st.direct=!st.direct;this.setAttribute('aria-pressed',st.direct?'true':'false');renderList();});
$('more').addEventListener('click',function(){st.show+=20;renderList();});

/* ========== TẢI DỮ LIỆU ========== */
renderAll();
$('stamp').textContent=t('loading');
fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(function(d){
  DATA=d;
  if(!d.cap_nhat_luc||!d.chang||!Object.keys(d.chang).length){renderAll();notice(t('firstRun'));return;}
  renderAll();
}).catch(function(e){$('stamp').textContent=t('noData');notice(t('loadErr',{e:e.message}));});
})();
</script>
</body>
</html>
